<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#16271c"><link rel="manifest" href="manifest.webmanifest"><title>ひとり飯ショート</title><style>body{margin:0;background:#101b14;color:white;font:16px -apple-system,sans-serif}main{max-width:520px;margin:auto;padding:16px}header{background:#1c3425;padding:15px;font-weight:bold;font-size:21px}.notice,.card{background:#203426;border-radius:15px;padding:15px;margin:12px 0}.notice{font-size:14px}button{background:#376346;border:0;color:white;border-radius:10px;padding:12px;margin:4px}button.selected{background:#9bd6a5;color:#122419}img{width:100%;aspect-ratio:9/12;object-fit:cover}iframe{width:100%;aspect-ratio:9/12;border:0}.title{font-size:19px;font-weight:bold}small{color:#b7d1bd}.tag{display:inline-block;background:#594b26;border-radius:7px;padding:5px;margin:4px 2px;font-size:12px}a{color:#a9e5ba}details{margin-top:14px;overflow-wrap:anywhere}#card{min-height:120px}</style><header>🍚 ひとり飯ショート</header><main><div class="notice">一人前・15分以内・500円以内を目指す料理候補です。<b>条件はすべて未確認</b>。動画で確かめてください。</div><button id="new" class="selected">新着</button><button id="fav">♥ お気に入り</button><button id="refresh">↻ 読み直す</button><p id="status">読み込み中…</p><div id="card"></div><button id="prev">↑ 前の動画</button><button id="next">↓ 次の動画</button></main><script>
let videos=[],mode='new',i=0;const $=id=>document.getElementById(id);const escapeHtml=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));let favs=new Set(JSON.parse(localStorage.getItem('hitorimeshi_favs')||'[]'));const shown=()=>mode==='fav'?videos.filter(v=>favs.has(v.id)):videos;
function render(){let list=shown();i=Math.min(Math.max(0,i),Math.max(0,list.length-1));$('status').textContent=`${list.length}件 / ${list.length?i+1:0}件目`;$('card').innerHTML='';if(!list.length){$('card').textContent='まだ動画がありません。初回の自動収集が完了すると表示されます。';return}let v=list[i],card=document.createElement('div');card.className='card';card.innerHTML=`<div id="poster"><img src="${escapeHtml(v.thumbnail)}" alt="サムネイル"><button id="play">▶ 動画を見る</button></div><p class="title">${escapeHtml(v.title)}</p><small>${escapeHtml(v.channel)} / ${escapeHtml((v.publishedAt||'').slice(0,10))}</small><p><span class="tag">1人前 未確認</span><span class="tag">15分以内 未確認</span><span class="tag">500円以内 未確認</span></p><button id="heart">${favs.has(v.id)?'♥ 保存済み':'♡ 保存'}</button><a href="https://www.youtube.com/watch?v=${encodeURIComponent(v.id)}" target="_blank" rel="noopener">YouTubeで開く</a><details><summary>材料・調味料（説明文から確認）</summary><p>材料と調味料の正確な一覧は未確認です。</p><p>${escapeHtml(v.description)}</p></details>`;$('card').append(card);card.querySelector('#play').onclick=()=>{let f=document.createElement('iframe');f.src='https://www.youtube.com/embed/'+encodeURIComponent(v.id)+'?playsinline=1';f.allow='accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture';f.allowFullscreen=true;card.querySelector('#poster').replaceWith(f)};card.querySelector('#heart').onclick=()=>{favs.has(v.id)?favs.delete(v.id):favs.add(v.id);localStorage.setItem('hitorimeshi_favs',JSON.stringify([...favs]));render()}}
async function load(){try{let r=await fetch('./data/videos.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);videos=(await r.json()).filter(v=>/^[\w-]{11}$/.test(v.id));render()}catch(e){$('status').textContent='データの読み込みに失敗: '+e.message}}$('new').onclick=()=>{mode='new';i=0;$('new').className='selected';$('fav').className='';render()};$('fav').onclick=()=>{mode='fav';i=0;$('fav').className='selected';$('new').className='';render()};$('refresh').onclick=load;$('prev').onclick=()=>{i--;render()};$('next').onclick=()=>{i++;render()};let start=0;document.addEventListener('touchstart',e=>start=e.touches[0].clientY,{passive:true});document.addEventListener('touchend',e=>{let d=e.changedTouches[0].clientY-start;if(Math.abs(d)>120&&!e.target.closest('iframe,details,button,a')){i+=d<0?1:-1;render()}},{passive:true});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});load();</script></html>
